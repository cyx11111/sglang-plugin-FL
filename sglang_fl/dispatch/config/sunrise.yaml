# SGLang-FL Dispatch Configuration for Sunrise / PTPU.
# A non-empty SGLANG_FL_FLAGOS_BLACKLIST replaces flagos_blacklist (no merge).
# SGLANG_FL_PREFER overrides `prefer`; SGLANG_FL_PER_OP replaces `op_backends`.
# run_sglang_sunrise.sh sets SGLANG_FL_PREFER=vendor, the same order as below.
prefer: flagos

# count_nonzero: the sunrise kernel fails on 3-D input with dim, which
# crashes EPLB init.
# sort: FlaGems Sunrise sort use pin_memory, which is not allowed during 
# stream capture.
# empty: FlagGems sunrise empty zero-fills every allocation with a kernel;
# under graph capture that is ~1700 extra kernels per decode step.
# mul：may hang in real dataset tests.
flagos_blacklist:
  - count_nonzero
  - sort
  - sort_stable
  - empty
  - mul
  - linear
  - mm
  - mm_out
  - addmm
  - addmm_
  - addmm_out
  - addmm_dtype
  - addmm_dtype_out
  - bmm
  - bmm_out
  - baddbmm
  - baddbmm_out


# Per-op order for the sunrise OOT registry (register_ops.py). These stay on
# the sunrise vendor kernel when `prefer` is flagos. FlagGems, then the
# PyTorch reference, are the fallbacks; a token with no registered impl is
# skipped. topk raises NotImplementedError for grouped / custom routing and
# then falls through.
op_backends:
  silu_and_mul:
    - vendor:sunrise
    - flagos
    - reference
  rms_norm:
    - vendor:sunrise
    - flagos
    - reference
  gemma_rms_norm:
    - vendor:sunrise
    - flagos
    - reference
  rotary_embedding:
    - vendor:sunrise
    - flagos
    - reference
  mrotary_embedding:
    - vendor:sunrise
    - flagos
    - reference
  topk:
    - vendor:sunrise
    - flagos
    - reference
  fused_moe:
    - vendor:sunrise
    - flagos
    - reference
  chunk_gated_delta_rule:
    - vendor:sunrise
    - flagos
    - reference
  fused_recurrent_gated_delta_rule_packed_decode:
    - vendor:sunrise
    - flagos
    - reference
